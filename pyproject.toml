[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "s3ntinel"
version = "0.1.0"
description = "S3NTINEL: Structural Streaming Sparse Event Nexus for Telemetry Inference with Network Envelope Learning"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "matplotlib>=3.7",
  "plotly>=5.0",
  "seaborn>=0.12",
  "pytest>=8.0",
  "ruff>=0.12",
]
spark = [
  "pyspark>=3.5,<3.6",
  "delta-spark>=3.0,<3.1",
]

[tool.setuptools.packages.find]
include = ["libs*", "pipelines*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
  ".specstory",
  "docs/archive",
  "repo_maps",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
