[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "s3ntinel"
version = "0.1.0"
description = "S3NTINEL: Structural Streaming Sparse Event Nexus for Telemetry Inference with Network Envelope Learning"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
spark = [
  "pyspark>=3.5,<3.6",
  "delta-spark>=3.0,<3.1",
]

[tool.setuptools.packages.find]
include = ["libs*", "pipelines*"]
