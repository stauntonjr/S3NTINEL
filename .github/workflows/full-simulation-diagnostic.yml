name: Full simulation stage diagnostic

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYSPARK_SUBMIT_ARGS: "--driver-memory 2g pyspark-shell"
      PYTHONUNBUFFERED: "1"
      S3NTINEL_STAGE80_EXPLAIN: "1"
      S3NTINEL_SPARK_PROFILE: "ci_small"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -e .[dev,spark]
      - name: Verify bounded GitHub runner profile
        run: |
          python -c 'import os; from libs.io.delta import describe_spark_runtime_config; p=os.environ.get("S3NTINEL_SPARK_PROFILE"); c=describe_spark_runtime_config(); print("profile=",p,"master=",c["spark.master"],"driver=",c["spark.driver.memory"]); assert p=="ci_small" and c["spark.master"]=="local[2]" and c["spark.driver.memory"]=="2g", "Refusing heavyweight or unexpected profile on GitHub runner"'
      - name: Identify stalled full-pipeline test and preserve logs
        run: |
          pytest -vv -s --log-cli-level=INFO --durations=0 \
            tests/contracts/public_api/test_simulation_public_api.py::test_simulation_public_api_runs_end_to_end
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-simulation-diagnostic
          path: |
            /tmp/pytest-of-*/
          retention-days: 7
          if-no-files-found: ignore
