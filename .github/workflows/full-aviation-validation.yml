name: Full aviation simulation validation

on:
  workflow_dispatch:
    inputs:
      confirm_hosted_runner:
        description: "Run resource-heavy validation on GitHub-hosted CPU runner? (must be true)"
        type: boolean
        required: true
        default: false

jobs:
  full-simulation:
    if: ${{ inputs.confirm_hosted_runner == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYSPARK_SUBMIT_ARGS: "--driver-memory 2g pyspark-shell"
      S3NTINEL_SPARK_PROFILE: "ci_small"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -e .[dev,spark]
      - name: Run full-pipeline contract and integration smoke
        run: |
          pytest -q -vv --durations=30 \
            tests/contracts/public_api/test_simulation_public_api.py::test_simulation_public_api_runs_end_to_end \
            tests/integration/runner/test_sim_runner.py::test_sim_runner_full_smoke_emits_bundle \
            tests/integration/simulation/test_dataset.py::test_canonical_sim_rows_flow_into_events_windows_and_window_features \
            tests/integration/pipelines/test_graph_pipeline.py::test_build_precision_graph_from_window_features_spark_table_produces_expected_columns \
            tests/integration/pipelines/test_graph_pipeline.py::test_build_graph_stage_evaluation_report_spark_reports_band_skew_and_sensitivity
