name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,spark]

      - name: Check Markdown documentation
        run: python tools/check_markdown_docs.py

      - name: Find changed Python files
        id: changed-python
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-list --max-parents=0 HEAD)"
          fi
          git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" HEAD -- '*.py' > changed-python-files
          if [[ -s changed-python-files ]]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint changed Python files
        if: steps.changed-python.outputs.any == 'true'
        run: xargs -0 ruff check -- < changed-python-files

      - name: Check formatting of changed Python files
        if: steps.changed-python.outputs.any == 'true'
        run: xargs -0 ruff format --check -- < changed-python-files

      - name: Run tests
        run: pytest
