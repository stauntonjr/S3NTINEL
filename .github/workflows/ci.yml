name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17 for Spark 3.5
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install quality tools
        run: python -m pip install "ruff>=0.12"

      - name: Check Markdown documentation
        run: python tools/check_markdown_docs.py

      - name: Find changed Python files
        id: changed-python
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-list --max-parents=0 HEAD)"
          fi
          git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" HEAD -- '*.py' > changed-python-files
          if [[ -s changed-python-files ]]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint changed Python files
        if: steps.changed-python.outputs.any == 'true'
        run: xargs -0 ruff check -- < changed-python-files

      - name: Check formatting of changed Python files
        if: steps.changed-python.outputs.any == 'true'
        run: xargs -0 ruff format --check -- < changed-python-files

  test-matrix:
    name: tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYSPARK_SUBMIT_ARGS: "--driver-memory 2g pyspark-shell"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: unit-contracts
            paths: tests/unit tests/contracts
          - name: integration-regression
            paths: tests/integration tests/regression
            extra_args: "--ignore=tests/integration/pipelines/test_graph_pipeline.py"
          - name: graph-integration
            paths: tests/integration/pipelines/test_graph_pipeline.py
            extra_args: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17 for Spark 3.5
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,spark]

      # Full persisted simulation runs are a separate resource-sized validation gate.
      # Keep all other unit, contract, integration, and regression tests on PRs.
      - name: Run ${{ matrix.name }} tests
        run: |
          pytest -q -vv --durations=30 --durations-min=1.0 ${{ matrix.paths }} ${{ matrix.extra_args }} \
            --deselect=tests/contracts/public_api/test_simulation_public_api.py::test_simulation_public_api_runs_end_to_end \
            --deselect=tests/integration/runner/test_sim_runner.py::test_sim_runner_full_smoke_emits_bundle
