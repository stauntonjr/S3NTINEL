name: Temporary graph formatting export
on:
  pull_request:
    paths:
      - "libs/graph/evaluation.py"
      - ".github/workflows/graph-format-export.yml"
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install "ruff==0.17.3"
      - run: |
          ruff format libs/graph/evaluation.py
          echo FORMAT_BEGIN
          base64 -w0 libs/graph/evaluation.py
          echo
          echo FORMAT_END
